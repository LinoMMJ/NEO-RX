# Neo RX Fine-tuning Configuration
# All hyperparameters and paths for training on NIH ChestX-ray14
#
# IMPORTANTE: Las métricas y resultados son PENDIENTES DE EJECUCIÓN EXPERIMENTAL.
# No se deben asumir valores de AUC, sensibilidad, especificidad, F1, etc.

data:
  data_dir: "/kaggle/input/nih-chest-xrays"              # Root directory with images/ and Data_Entry_2017.csv
  splits_json: "/kaggle/working/manifests/splits.json"
  manifest: "/kaggle/working/manifests/clean_manifest.csv"  # Patient-level train/val/test splits
  processed_dir: "/kaggle/working/processed"  # Optional preprocessed cache (not used in v1)

model:
  base_weights: "resnet50-res512-all"  # torchxrayvision pretrained weights
  num_classes: 12                      # 12 pulmonary labels (excluye Cardiomegaly, Hernia)
  checkpoint_dir: "/kaggle/working/checkpoints"
  checkpoint_name: "finetuned_resnet50_nih.pt"

train:
  epochs_head: 3                       # Head-only training epochs
  epochs_finetune: 7                   # Partial unfreeze training epochs
  lr_head: 1.0e-3                      # Learning rate for head-only phase
  lr_finetune: 1.0e-4                  # Learning rate for partial unfreeze phase
  weight_decay: 1.0e-4
  batch_size: 16
  num_workers: 4
  mixed_precision: true
  early_stopping_patience: 4
  grad_clip: 1.0
  seed: 42
  log_dir: "/kaggle/working/runs"
  # Class imbalance handling (calculated from TRAIN split only)
  use_pos_weight: true                 # Enable pos_weight in BCEWithLogitsLoss

# Data Augmentation (ONLY for TRAIN split)
augmentation:
  enabled: true
  rotation_degrees: 5                  # Small rotations (±5°)
  scale_range: 0.10                    # Scale variation (±10%)
  brightness: 0.15                     # Brightness jitter (±15%)
  contrast: 0.15                       # Contrast jitter (±15%)
  gaussian_noise_std: 0.01             # Gaussian noise (std=0.01)
  # NO horizontal_flip: anatomically problematic for chest X-rays (laterality)
  horizontal_flip: false

# Threshold optimization (on VALIDATION only)
threshold:
  method: "youden_j"                   # Youden's J = sensitivity + specificity - 1
  min_threshold: 0.05
  max_threshold: 0.95

# Experiment tracking
experiment:
  name: "neorx_v1_3_3_kaggle"
  description: "Neo RX v1.3.3 reproducible Kaggle fine-tuning on audited NIH ChestX-ray14"
  tags: ["pulmonary", "resnet50", "nih-chestxray14", "transfer-learning"]

# Pulmonary-only labels (12 classes - excludes Cardiomegaly, Hernia)
# Order MUST match dataset.py and model checkpoint
pulmonary_labels:
  - "Atelectasis"
  - "Consolidation"
  - "Edema"
  - "Emphysema"
  - "Effusion"
  - "Fibrosis"
  - "Infiltration"
  - "Mass"
  - "Nodule"
  - "Pleural_Thickening"
  - "Pneumonia"
  - "Pneumothorax"

# English to Spanish mapping for clinical output (only pulmonary labels)
labels_es:
  Atelectasis: "Atelectasia"
  Consolidation: "Consolidación"
  Edema: "Edema pulmonar"
  Emphysema: "Enfisema"
  Effusion: "Derrame pleural"
  Fibrosis: "Fibrosis pulmonar"
  Infiltration: "Infiltrado pulmonar"
  Mass: "Masa pulmonar"
  Nodule: "Nódulo pulmonar"
  Pleural_Thickening: "Engrosamiento pleural"
  Pneumonia: "Neumonía"
  Pneumothorax: "Neumotórax"

# Original NIH 14 labels (for reference/comparison with baseline)
nih_labels:
  - "Atelectasis"
  - "Cardiomegaly"
  - "Consolidation"
  - "Edema"
  - "Emphysema"
  - "Effusion"
  - "Fibrosis"
  - "Hernia"
  - "Infiltration"
  - "Mass"
  - "Nodule"
  - "Pleural_Thickening"
  - "Pneumonia"
  - "Pneumothorax"
