# Privacy: no query values, referrers or clinical filenames in access logs.
log_format neorx_private '$remote_addr [$time_local] $request_method $status $body_bytes_sent';

# Docker puede cambiar la IP del backend al reconstruir el contenedor. La zona
# compartida y `resolve` hacen que Nginx consulte de nuevo el DNS interno en vez
# de conservar una IP obsoleta hasta el siguiente reinicio del frontend.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream neorx_backend {
    zone neorx_backend 64k;
    server backend:8000 resolve;
}

# Nginx configuration for Neo RX Frontend (React SPA)
# Sirve archivos estáticos y hace proxy a backend API

server {
    access_log /var/log/nginx/access.log neorx_private;
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Seguridad headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback - serve index.html for all routes
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://neorx_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # CORS se aplica únicamente en Django con una lista explícita de orígenes.
    }

    # Estado público del despliegue (Django comprueba también la base de datos).
    location = /health/ {
        proxy_pass http://neorx_backend/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Media files (servidos por Nginx para mejor performance)
    location ^~ /media/ {
        proxy_pass http://neorx_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "private, no-store" always;
    }

    # Static files (servidos por Nginx)
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
